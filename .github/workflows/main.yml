name: sc-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            zip_name: Proteus-mac_arm.zip
          - os: macos-13
            zip_name: Proteus-mac_intel.zip
          - os: windows-latest
            zip_name: Proteus-windows.zip

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Get SC source code
      run: git clone https://github.com/supercollider/supercollider.git ${{ github.workspace }}/supercollider

    - name: Build libsamplerate (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        cd libsamplerate
        mkdir build -Force
        cd build
        cmake -DLIBSAMPLERATE_EXAMPLES=OFF -DBUILD_TESTING=OFF ..
        cmake --build . --config Release

    - name: Build libsamplerate (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd libsamplerate
        mkdir -p build && cd build
        cmake -DLIBSAMPLERATE_EXAMPLES=OFF -DBUILD_TESTING=OFF ..
        cmake --build . --config Release

    - name: Create Build Environment
      run: cmake -E make_directory ${{ github.workspace }}/build

    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: cmake .. -DCMAKE_BUILD_TYPE=Release -DSC_PATH=${{ github.workspace }}/supercollider

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      working-directory: ${{ github.workspace }}/build
      run: cmake .. -DCMAKE_BUILD_TYPE=Release -DSC_PATH="${{ github.workspace }}/supercollider"

    - name: Build (Unix)
      if: matrix.os != 'windows-latest'
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: cmake --build . --config Release --target install

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ github.workspace }}/build
      shell: pwsh
      run: cmake --build . --config Release --target install

    - name: Debug - List build contents
      shell: bash
      run: |
        echo "Contents of build directory:"
        ls -la ${{ github.workspace }}/build/ || dir "${{ github.workspace }}/build/"
        echo "Looking for Proteus folder:"
        find ${{ github.workspace }}/build/ -name "Proteus*" -type d || echo "Proteus folder not found"

    - name: Create zip (macOS)
      if: startsWith(matrix.os, 'macos')
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: |
        if [ -d "Proteus" ]; then
          zip -r ${{ matrix.zip_name }} Proteus
          mv ${{ matrix.zip_name }} ${{ github.workspace }}/
        else
          echo "Proteus directory not found!"
          exit 1
        fi

    - name: Create zip (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      working-directory: ${{ github.workspace }}/build
      run: |
        if (Test-Path "Proteus") {
          Compress-Archive -Path "Proteus" -DestinationPath "${{ github.workspace }}/${{ matrix.zip_name }}"
        } else {
          Write-Error "Proteus directory not found!"
          exit 1
        }

    - name: Verify zip file exists
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/${{ matrix.zip_name }}" ]; then
          echo "✅ Zip file created successfully: ${{ matrix.zip_name }}"
          ls -la "${{ github.workspace }}/${{ matrix.zip_name }}"
        else
          echo "❌ Zip file not found: ${{ matrix.zip_name }}"
          echo "Files in workspace:"
          ls -la ${{ github.workspace }}/
          exit 1
        fi

    - name: Check if release exists
      uses: mukunku/tag-exists-action@v1.6.0
      id: checkTag
      with:
        tag: ${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # - name: Create Release
    #   if: steps.checkTag.outputs.exists == 'false' && matrix.os == 'macos-14'
    #   id: create_release
    #   uses: actions/create-release@v1
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   with:
    #     tag_name: ${{ github.ref }}
    #     release_name: 'Proteus Release ${{ github.ref }}'
    #     draft: false
    #     prerelease: false

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/${{ matrix.zip_name }}
        asset_name: ${{ matrix.zip_name }}
        tag: ${{ github.ref }}
        overwrite: true

